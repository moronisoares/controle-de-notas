# Verificacao automatica do codigo.
#
# Este workflow NAO publica APK para instalacao. O runner do GitHub nao tem a
# chave de assinatura do projeto (keystore.properties fica fora do Git), entao
# o APK gerado aqui sai assinado com uma chave de depuracao aleatoria, criada
# na hora. Um APK assim nao instala por cima de uma versao ja instalada: o
# Android recusa com "App nao instalado".
#
# Os APKs para instalar sao gerados na maquina de desenvolvimento, assinados
# com a chave fixa, e publicados nas Releases (ex.: a tag v1.7).
#
# O artefato abaixo continua disponivel apenas para conferencia do build.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/testDebugUnitTest

      # Apenas para conferencia do build -- NAO use este APK para instalar no
      # celular: a assinatura e diferente da usada nas Releases.
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControleDeNotas-debug-NAO-INSTALAVEL
          path: app/build/outputs/apk/debug/app-debug.apk
